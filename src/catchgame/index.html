<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Catch the Treats</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="panel">
      <div class="toolbar">
        <div class="group" id="difficultyGroup">
          <button data-value="easy">easy</button>
          <button data-value="medium">medium</button>
          <button data-value="hard">hard</button>
        </div>
        <button id="newGameBtn" class="secondary">New Game</button>
      </div>

      <div class="hud">
        <span>Score: <b id="score">0</b></span>
        <span>Misses: <b id="misses">0</b>/<b id="maxMisses">3</b></span>
      </div>

      <canvas id="stage" width="480" height="320"></canvas>
      <div class="hint">← → or A / D to move the basket</div>

      <div class="results hidden" id="results">
        <div class="big-text">Game Over</div>
        <div class="sub-text" id="finalScore"></div>
        <button id="playAgainBtn" class="secondary">Play Again</button>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
