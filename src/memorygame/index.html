<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Memory Match</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="panel">
      <div class="toolbar">
        <div class="group" id="difficultyGroup">
          <button data-value="6">easy</button>
          <button data-value="8">medium</button>
          <button data-value="12">hard</button>
        </div>
        <button id="newGameBtn" class="secondary">New Game</button>
      </div>

      <div class="status" id="status">Moves: 0</div>

      <div class="board" id="board"></div>

      <div class="results hidden" id="results">
        <div class="big-text">You matched them all! 🎉</div>
        <div class="sub-text" id="resultMoves"></div>
        <button id="playAgainBtn" class="secondary">Play Again</button>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
